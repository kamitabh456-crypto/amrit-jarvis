<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMRIT JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050b16;
  color:#00eaff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px 15px;
}
h1{
  margin-top:20px;
  letter-spacing:3px;
  text-shadow:0 0 15px #00eaff;
}
.circle{
  width:190px;
  height:190px;
  border:3px solid #00eaff;
  border-radius:50%;
  margin:35px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  box-shadow:0 0 30px #007bff;
}
#status{color:#9eefff}
.chat{
  max-width:450px;
  margin:auto;
}
#answer{
  min-height:90px;
  padding:15px;
  border:1px solid #007bff;
  border-radius:12px;
  margin:20px 0;
  color:white;
  white-space:pre-wrap;
}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #00eaff;
  background:#101c2d;
  color:white;
  font-size:16px;
}
button{
  padding:13px 20px;
  margin:8px 4px;
  border:0;
  border-radius:10px;
  background:#00cfff;
  color:#00101c;
  font-weight:bold;
  font-size:15px;
}
</style>
</head>
<body>

<h1>AMRIT JARVIS</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="circle">🤖</div>
<p id="status">SYSTEM ONLINE</p>

<div class="chat">
  <div id="answer">Hello Amrit! I am Jarvis. How can I help you?</div>

  <input id="question" placeholder="Ask Jarvis anything...">

  <button onclick="askJarvis()">ASK AI</button>
  <button onclick="listen()">🎤 SPEAK</button>
</div>

<script>
async function askJarvis(){
  const q=document.getElementById("question").value.trim();
  const answer=document.getElementById("answer");
  if(!q)return;

  answer.textContent="Jarvis is thinking...";

  try{
    const r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q})
    });

    const data=await r.json();
    answer.textContent=data.reply || data.error || "No response received.";
  }catch(e){
    answer.textContent="AI connection is not ready yet. We will connect it in the next step.";
  }
}

function listen(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("Voice recognition is not supported in this browser.");
    return;
  }

  const rec=new SpeechRecognition();
  rec.lang="hi-IN";
  rec.onstart=()=>document.getElementById("status").textContent="LISTENING...";
  rec.onresult=(e)=>{
    document.getElementById("question").value=e.results[0][0].transcript;
    askJarvis();
  };
  rec.onerror=()=>document.getElementById("status").textContent="SYSTEM ONLINE";
  rec.onend=()=>document.getElementById("status").textContent="SYSTEM ONLINE";
  rec.start();
}
</script>

</body>
</html>
